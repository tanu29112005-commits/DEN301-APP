apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: den301-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tanu29112005-commits/DEN301-APP.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true