apiVersion: apps/v1
kind: Deployment
metadata:
  name: den301-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: den301-app
  template:
    metadata:
      labels:
        app: den301-app
    spec:
      containers:
        - name: den301-app
          image: den301-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          envFrom:
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: den301-app-service
spec:
  type: NodePort
  selector:
    app: den301-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080